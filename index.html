
<!DOCTYPE html>
<html lang="en">

<head>
    <title>History Museum - Group 21</title>
    <meta charset="UTF-8">
    <meta name="description" content="Explore historical museum exhibits">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>THE HISTORY MUSEUM</h1>
        <p><em>Discover the stories behind our past</em></p>

        </p>

    <hr>
    <section id="filters">

    <input type="button" id="all" value="All Exhibits">
    <input type="button" id="ancient" value="Ancient">
    <input type="button" id="medieval" value="Medieval">
    <input type="button" id="modern" value="Modern">

    </section>

    <hr>
    <script src="script.js"></script>
